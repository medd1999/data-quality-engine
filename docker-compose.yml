services:
  api:
    build: ./api
    container_name: sentineldq_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sentineldq
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=sentineldq
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      - db
      - minio
    volumes:
      - ./api:/app
    networks:
      - sentineldq-net

  spark-engine:
    build: ./spark-engine
    container_name: sentineldq_spark
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sentineldq
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=sentineldq
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
    depends_on:
      - db
      - minio
    volumes:
      - ./spark-engine:/app
    networks:
      - sentineldq-net

  alerting-service:
    build: ./alerting-service
    container_name: sentineldq_alerts
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/sentineldq
    depends_on:
      - db
    volumes:
      - ./alerting-service:/app
    networks:
      - sentineldq-net

  frontend:
    build: ./frontend
    container_name: sentineldq_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - sentineldq-net

  db:
    image: postgres:15
    container_name: sentineldq_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentineldq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentineldq-net

  minio:
    image: minio/minio
    container_name: sentineldq_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console UI
    volumes:
      - minio_data:/data
    networks:
      - sentineldq-net

volumes:
  postgres_data:
  minio_data:

networks:
  sentineldq-net:
    driver: bridge
